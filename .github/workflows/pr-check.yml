name: PR Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/RealEstateMarketplace.slnx

      - name: Check NuGet packages for vulnerabilities (fail on High/Critical)
        run: bash .github/scripts/check-nuget-vulnerabilities.sh backend/RealEstateMarketplace.slnx

      - name: Build solution
        run: dotnet build backend/RealEstateMarketplace.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/RealEstateMarketplace.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ./TestResults/*.trx
          retention-days: 7

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (fail on high/critical)
        run: npm audit --audit-level=high --omit=dev

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build

  bicep-validate:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Bicep syntax
        run: az bicep build --file .infra/main.bicep

  trivy-fs:
    name: Trivy Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to the commit SHA of v0.36.0 (not @master): a tag or branch can be moved
      # by whoever controls the repository, a commit SHA cannot.
      - name: Scan repository dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'
